<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automation Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      }

      header h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      header p {
        margin: 4px 0 0;
        font-size: 0.8rem;
        color: rgba(226, 232, 240, 0.6);
      }

      #typingIndicator {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        font-size: 0.84rem;
        color: rgba(226, 232, 240, 0.75);
      }

      .typing-dots {
        display: inline-flex;
        gap: 4px;
      }

      .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #38bdf8;
        animation: typingBlink 1.2s infinite ease-in-out both;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 16px 16px;
      }

      li {
        border-radius: 10px;
        padding: 12px 14px;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.25);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      li.active {
        border-color: #38bdf8;
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
      }

      li.done {
        opacity: 0.75;
      }

      li.failed {
        border-color: #f87171;
      }

      li.sending .status {
        background: linear-gradient(90deg, #38bdf8, #0ea5e9);
        color: #0f172a;
      }

      .phone {
        font-weight: 600;
        font-size: 0.95rem;
        color: #f8fafc;
      }

      .message {
        font-size: 0.85rem;
        color: rgba(226, 232, 240, 0.8);
      }

      .status {
        align-self: flex-start;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(148, 163, 184, 0.2);
        color: #f1f5f9;
      }

      li.done .status {
        background: linear-gradient(90deg, #34d399, #22c55e);
        color: #0f172a;
      }

      li.failed .status {
        background: linear-gradient(90deg, #f87171, #ef4444);
        color: #0f172a;
      }

      li.sending .status {
        background: linear-gradient(90deg, #38bdf8, #0ea5e9);
        color: #0f172a;
      }

      li.pending .status {
        background: linear-gradient(90deg, #facc15, #f97316);
        color: #0f172a;
      }

      .empty {
        margin-top: 32px;
        text-align: center;
        font-size: 0.9rem;
        color: rgba(226, 232, 240, 0.65);
      }

      @keyframes typingBlink {
        0%, 80%, 100% { opacity: 0; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-2px); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WA Auto Sender Monitor</h1>
      <p>Daftar pesan yang sedang/sudah dikirim.</p>
    </header>

    <div id="typingIndicator">
      <span class="typing-dots"><span></span><span></span><span></span></span>
      <span>Sedang mengetik di WhatsApp…</span>
    </div>

    <ul id="messageList">
      <li class="empty">Belum ada data.</li>
    </ul>

    <script>
      const typingIndicator = document.getElementById('typingIndicator');
      const list = document.getElementById('messageList');

      function renderQueue(queue = [], activeId = null) {
        list.innerHTML = '';
        if (!queue.length) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'Semua pesan sudah diproses.';
          list.appendChild(empty);
          return;
        }

        queue.forEach(item => {
          const status = (item.status || 'pending').toLowerCase();
          const li = document.createElement('li');
          li.classList.add(status);
          if (String(item.id) === String(activeId)) {
            li.classList.add('active');
          }

          li.innerHTML = `
            <div class="phone">${item.phone}</div>
            <div class="message">${item.message}</div>
            <span class="status">${status.toUpperCase()}</span>
          `;

          list.appendChild(li);
        });
      }

      window.monitorAPI?.onAutomationUpdate?.(({ queue = [], activeId = null, typing = false } = {}) => {
        renderQueue(queue, activeId);
        typingIndicator.style.display = typing && queue.length ? 'flex' : 'none';
      });
    </script>
  </body>
</html>
