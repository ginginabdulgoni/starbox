<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Monitor</title>
  <style>
    :root {
      --bg: #071a2b;
      --bg-2: #0d2438;
      --border: #2c4d67;
      --text: #e5f2fb;
      --muted: #97b1c6;
      --brand: #1ec8a5;
      --danger: #dd6075;
      --ok: #53d89b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Sora", "Manrope", "Avenir Next", "Segoe UI", sans-serif;
      background: radial-gradient(900px 400px at 100% -10%, #1ec8a51f, transparent), linear-gradient(160deg, #041321, #0a2033 42%, #0e2940);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
    }

    .top {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #0a1d2ed9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title {
      min-width: 0;
    }

    .title strong {
      font-size: 13px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title small {
      color: var(--muted);
      font-size: 11px;
      display: block;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
      background: var(--danger);
      box-shadow: 0 0 0 3px #dd607534;
    }

    .status.connected .dot {
      background: var(--ok);
      box-shadow: 0 0 0 3px #53d89b2f;
    }

    .tools {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: #0e2235;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field label {
      font-size: 10px;
      color: #89a8bf;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 700;
    }

    select {
      background: #081b2a;
      color: var(--text);
      border: 1px solid #335875;
      border-radius: 9px;
      font-size: 12px;
      padding: 6px 8px;
      min-width: 120px;
      outline: none;
    }

    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px #1ec8a527;
    }

    button {
      border: 1px solid #355c78;
      border-radius: 9px;
      background: #12304a;
      color: #ddf2ff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      cursor: pointer;
      transition: opacity .12s ease, transform .12s ease;
      margin-top: 15px;
    }

    button:hover { opacity: .92; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-brand { background: linear-gradient(130deg, #1ec8a5, #15a88a); color: #03221c; border-color: #20bea0; }
    .btn-danger { background: #4c2732; border-color: #6d3b49; color: #ffd4dc; }

    .viewer {
      background: #010913;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
      position: relative;
    }

    .viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      border-radius: 0;
      background: #010913;
      cursor: crosshair;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
    }

    .bottom {
      border-top: 1px solid var(--border);
      background: #0a1c2b;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log {
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    @media (max-width: 840px) {
      .tools {
        padding: 8px;
      }

      .field label {
        display: none;
      }

      button {
        margin-top: 0;
      }

      .log {
        max-width: 58%;
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">
      <strong id="titleMain">Remote View</strong>
      <small id="titleSub">Menunggu data...</small>
    </div>
    <div id="connStatus" class="status"><span class="dot"></span>Disconnected</div>
  </div>

  <div class="tools">
    <div class="field">
      <label>Quality</label>
      <select id="qualitySelect">
        <option value="65">High (65)</option>
        <option value="58" selected>Balanced (58)</option>
        <option value="50">Medium (50)</option>
        <option value="40">Low (40)</option>
      </select>
    </div>

    <button class="btn-brand" id="btnRefresh">Refresh</button>
    <button id="btnFocus">Fokus</button>
    <button id="btnReload">Reload</button>
    <button class="btn-danger" id="btnStop">Stop</button>
    <button id="btnClose">Tutup</button>
  </div>

  <div class="viewer">
    <img id="remoteImage" alt="remote-frame" />
  </div>

  <div class="bottom">
    <div id="infoText">Menunggu frame...</div>
    <div id="logText" class="log">Siap</div>
  </div>

<script>
  const q = new URLSearchParams(window.location.search || "");

  const state = {
    clientId: String(q.get("toClientId") || ""),
    uid: String(q.get("uid") || ""),
    deviceName: String(q.get("name") || ""),
    resolution: String(q.get("resolution") || "960x540").toLowerCase(),
    quality: 58,
    connected: false,
    frameWidth: 0,
    frameHeight: 0,
    busy: false,
    timer: null,
    lastMoveAt: 0,
    lastMoveKey: "",
    lastWheelAt: 0,
    lastKeyAt: 0,
    lastInputAt: 0,
    lastLog: "Siap",
    cachedRect: null,       // cache getBoundingClientRect
    cachedRectAt: 0,        // timestamp cache
  };

  const els = {
    titleMain: document.getElementById("titleMain"),
    titleSub: document.getElementById("titleSub"),
    connStatus: document.getElementById("connStatus"),
    qualitySelect: document.getElementById("qualitySelect"),
    btnRefresh: document.getElementById("btnRefresh"),
    btnFocus: document.getElementById("btnFocus"),
    btnReload: document.getElementById("btnReload"),
    btnStop: document.getElementById("btnStop"),
    btnClose: document.getElementById("btnClose"),
    remoteImage: document.getElementById("remoteImage"),
    infoText: document.getElementById("infoText"),
    logText: document.getElementById("logText"),
  };

  function setLog(message) {
    state.lastLog = message;
    els.logText.textContent = message;
  }

  function updateTitle() {
    const shortUid = state.uid ? state.uid.slice(0, 12) : "-";
    const name = state.deviceName || state.uid || "Remote View";
    const host = state.clientId || "-";

    document.title = `Remote View - ${name}`;
    els.titleMain.textContent = name;
    els.titleSub.textContent = `${host} · ${shortUid}`;
  }

  function updateConnStatus() {
    els.connStatus.className = state.connected ? "status connected" : "status";
    els.connStatus.innerHTML = `<span class="dot"></span>${state.connected ? "Connected" : "Disconnected"}`;
  }

  function parseResolution(value) {
    const normalized = String(value || "auto").toLowerCase();
    if (normalized === "auto") return null;
    const m = normalized.match(/^(\d{3,5})x(\d{3,5})$/);
    if (!m) return null;

    const width = Number(m[1]);
    const height = Number(m[2]);
    if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) {
      return null;
    }
    return { width, height };
  }

  function getViewerSize() {
    const v = els.remoteImage.parentElement;
    if (!v) return { width: 960, height: 540 };
    return {
      width: Math.max(320, Math.floor(v.clientWidth)),
      height: Math.max(240, Math.floor(v.clientHeight)),
    };
  }

  function getCapturePayload() {
    const { width, height } = getViewerSize();
    return {
      uid: state.uid,
      quality: state.quality,
      max_width: width,
      max_height: height,
    };
  }

  function clearTimer() {
    if (state.timer) {
      clearTimeout(state.timer);
      state.timer = null;
    }
  }

  function schedulePoll(delayMs = 0) {
    clearTimer();
    state.timer = setTimeout(() => {
      fetchFrame().catch(() => {});
    }, delayMs);
  }

  async function sendCommand(command, payload = {}) {
    const res = await window.electronAPI.remote.sendCommand(state.clientId, command, payload);
    if (!res?.success) throw new Error(res?.error || "Unknown error");
    return res.result;
  }

  function fireCommand(command, payload = {}) {
    window.electronAPI.remote.fireCommand(state.clientId, command, payload);
  }

  async function fetchFrame(forceNow = false) {
    if (!state.clientId || !state.uid) return;
    if (state.busy && !forceNow) return;

    state.busy = true;
    try {
      const result = await sendCommand("capture_tab", getCapturePayload());
      state.frameWidth = Number(result?.width || 0);
      state.frameHeight = Number(result?.height || 0);

      if (result?.image_base64) {
        els.remoteImage.src = `data:image/jpeg;base64,${result.image_base64}`;
      }

      const size = `${state.frameWidth || "-"}x${state.frameHeight || "-"}`;
      const title = result?.title ? ` · ${result.title}` : "";
      els.infoText.textContent = `${size}${title}`;
      setLog("Frame OK");
      schedulePoll(0);
    } catch (err) {
      els.infoText.textContent = `Error: ${err.message}`;
      setLog(`Capture gagal: ${err.message}`);
      schedulePoll(800);
    } finally {
      state.busy = false;
    }
  }

  function getCachedRect() {
    const now = Date.now();
    // Invalidate cache setiap 200ms atau saat window resize
    if (!state.cachedRect || now - state.cachedRectAt > 200) {
      const r = els.remoteImage.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      state.cachedRect = r;
      state.cachedRectAt = now;
    }
    return state.cachedRect;
  }

  function getPoint(event) {
    if (!state.frameWidth || !state.frameHeight) return null;
    const rect = getCachedRect();
    if (!rect) return null;

    const localX = event.clientX - rect.left;
    const localY = event.clientY - rect.top;

    const x = Math.max(0, Math.min(state.frameWidth - 1, Math.round((localX / rect.width) * state.frameWidth)));
    const y = Math.max(0, Math.min(state.frameHeight - 1, Math.round((localY / rect.height) * state.frameHeight)));
    return { x, y };
  }

  function movePointer(event) {
    const point = getPoint(event);
    if (!point) return;

    const nowTs = Date.now();
    if (nowTs - state.lastMoveAt < 30) return;          // max ~33 move/detik
    const key = `${point.x}:${point.y}`;
    if (state.lastMoveKey === key) return;               // posisi tidak berubah

    state.lastMoveAt = nowTs;
    state.lastMoveKey = key;
    state.lastInputAt = nowTs;

    fireCommand("move_tab", {
      uid: state.uid,
      x: point.x,
      y: point.y,
      frame_width: state.frameWidth,
      frame_height: state.frameHeight,
    });
  }

  function normalizeWheelDelta(event) {
    const linePx = 34;
    const pagePx = 520;
    let factor = 1;
    if (event.deltaMode === 1) factor = linePx;
    if (event.deltaMode === 2) factor = pagePx;

    const rawX = Number(event.deltaX || 0) * factor;
    const rawY = Number(event.deltaY || 0) * factor;
    const clamp = (v) => Math.max(-420, Math.min(420, Math.round(v)));

    return { deltaX: clamp(rawX), deltaY: clamp(rawY) };
  }

  function scrollView(event) {
    const point = getPoint(event);
    if (!point) return;

    const nowTs = Date.now();
    if (nowTs - state.lastWheelAt < 16) {  // max ~60 scroll event/detik
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    state.lastWheelAt = nowTs;
    state.lastInputAt = nowTs;

    const { deltaX, deltaY } = normalizeWheelDelta(event);
    if (!deltaX && !deltaY) return;

    fireCommand("scroll_tab", {
      uid: state.uid,
      x: point.x,
      y: point.y,
      delta_x: deltaX,
      delta_y: deltaY,
      frame_width: state.frameWidth,
      frame_height: state.frameHeight,
    });

    event.preventDefault();
    event.stopPropagation();
  }

  function tapView(event) {
    const point = getPoint(event);
    if (!point) return;

    state.lastInputAt = Date.now();
    state.cachedRect = null; // invalidate rect cache setelah klik (halaman mungkin scroll)
    fireCommand("tap_tab", {
      uid: state.uid,
      x: point.x,
      y: point.y,
      frame_width: state.frameWidth,
      frame_height: state.frameHeight,
    });
    setLog("Tap terkirim");
  }

  function isEditableTarget(target) {
    if (!target || typeof target !== "object") return false;
    const tag = (target.tagName || "").toUpperCase();
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
    return target.isContentEditable === true;
  }

  function buildKeyText(event) {
    if (!event || typeof event.key !== "string") return "";
    if (event.ctrlKey || event.metaKey || event.altKey) return "";
    if (event.key.length === 1) return event.key;
    if (event.key === "Enter") return "\r";
    if (event.key === "Tab") return "\t";
    return "";
  }

  function handleKeydown(event) {
    if (isEditableTarget(event.target)) return;
    const key = String(event.key || "");
    if (!key || key === "Dead" || key === "Process") return;

    // Throttle key repeat (tombol ditahan) agar tidak flood server
    const nowTs = Date.now();
    if (event.repeat && nowTs - state.lastKeyAt < 40) return; // max ~25 repeat/detik
    state.lastKeyAt = nowTs;

    const modifiers = [];
    if (event.shiftKey) modifiers.push("shift");
    if (event.ctrlKey) modifiers.push("control");
    if (event.altKey) modifiers.push("alt");
    if (event.metaKey) modifiers.push("meta");

    fireCommand("key_tab", {
      uid: state.uid,
      key,
      code: String(event.code || ""),
      modifiers,
      text: buildKeyText(event),
      event_type: "down",
    });

    state.lastInputAt = nowTs;

    if (key !== "F5") {
      event.preventDefault();
      event.stopPropagation();
    }
  }

  async function runQuick(command) {
    try {
      const result = await sendCommand(command, { uid: state.uid });
      setLog(`${command}: ${JSON.stringify(result).slice(0, 90)}`);
      if (command === "stop_device") {
        setTimeout(() => window.close(), 600);
      }
      if (command === "reload_tab" || command === "focus_tab") {
        fetchFrame(true).catch(() => {});
      }
    } catch (err) {
      setLog(`${command} gagal: ${err.message}`);
    }
  }

  function bindUI() {
    els.qualitySelect.value = String(state.quality);

    // Re-fetch dengan resolusi baru saat window diresize
    let resizeDebounce = null;
    const ro = new ResizeObserver(() => {
      state.cachedRect = null; // invalidate rect cache saat resize
      clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(() => {
        fetchFrame(true).catch(() => {});
      }, 300);
    });
    const viewer = els.remoteImage.parentElement;
    if (viewer) ro.observe(viewer);

    els.qualitySelect.addEventListener("change", () => {
      state.quality = Number(els.qualitySelect.value || 58);
      setLog(`Quality: ${state.quality}`);
      fetchFrame(true).catch(() => {});
    });

    els.btnRefresh.addEventListener("click", () => fetchFrame(true).catch(() => {}));
    els.btnFocus.addEventListener("click", () => runQuick("focus_tab"));
    els.btnReload.addEventListener("click", () => runQuick("reload_tab"));
    els.btnStop.addEventListener("click", () => runQuick("stop_device"));
    els.btnClose.addEventListener("click", () => window.close());

    els.remoteImage.addEventListener("mousemove", movePointer);
    els.remoteImage.addEventListener("click", tapView);
    els.remoteImage.addEventListener("wheel", scrollView, { passive: false });

    document.addEventListener("keydown", handleKeydown, true);
  }

  async function init() {
    updateTitle();
    bindUI();

    window.electronAPI.remote.onConnectionChanged(({ connected }) => {
      state.connected = !!connected;
      updateConnStatus();
    });

    if (window.electronAPI?.remote?.onMonitorMetaUpdate) {
      window.electronAPI.remote.onMonitorMetaUpdate((data) => {
        if (!data) return;
        if (String(data.uid || "") !== state.uid) return;
        if (String(data.toClientId || "") !== state.clientId) return;

        state.deviceName = String(data.deviceName || state.deviceName);
        updateTitle();
        fetchFrame(true).catch(() => {});
      });
    }

    try {
      const snapshot = await window.electronAPI.remote.getClients();
      state.connected = !!snapshot?.connected;
      updateConnStatus();
    } catch {
      state.connected = false;
      updateConnStatus();
    }

    if (!state.clientId || !state.uid) {
      els.infoText.textContent = "Parameter monitor tidak valid.";
      setLog("Gagal start: toClientId/uid kosong");
      return;
    }

    setLog("Memulai monitor...");
    fetchFrame(true).catch(() => {});
  }

  window.addEventListener("beforeunload", () => {
    clearTimer();
  });

  init().catch((err) => {
    setLog(`Init gagal: ${err.message}`);
    els.infoText.textContent = `Error: ${err.message}`;
  });
</script>
</body>
</html>
