<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>StarDesk Sender</title></head>
<body>
<script>
  "use strict";
  const { ipcRenderer } = require("electron");

  // viewerClientId passed via URL hash for instant startup (no IPC round-trip)
  const viewerClientId = decodeURIComponent(location.hash.slice(1));

  let _timer        = null;
  let currentStream = null;

  const canvas = document.createElement("canvas");
  const ctx    = canvas.getContext("2d");
  const video  = document.createElement("video");
  video.muted    = true;
  video.autoplay = true;

  function sendError(msg) {
    ipcRenderer.send("stardesk:stream-frame", { viewerClientId, error: msg });
  }

  async function startCapture() {
    if (!viewerClientId) { sendError("NO_VIEWER_ID"); return; }

    let screenInfo = { width: 1920, height: 1080, scaleFactor: 1 };
    try {
      const si = await ipcRenderer.invoke("stardesk:get-screen-size");
      if (si) screenInfo = si;
    } catch {}

    let sources;
    try {
      sources = await ipcRenderer.invoke("stardesk:get-screen-sources");
    } catch (e) { sendError("GET_SOURCES_FAILED: " + e.message); return; }

    if (!sources || sources.length === 0) { sendError("NO_SOURCES"); return; }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          mandatory: {
            chromeMediaSource:   "desktop",
            chromeMediaSourceId: sources[0].id,
            maxWidth:  1920,
            maxHeight: 1080,
            maxFrameRate: 30,
          },
        },
      });
    } catch (e) { sendError("GETUSERMEDIA_FAILED: " + e.message); return; }

    currentStream   = stream;
    video.srcObject = stream;

    try { await video.play(); } catch (e) { sendError("VIDEO_PLAY_FAILED: " + e.message); return; }

    // Wait for first frame dimensions
    await new Promise((resolve) => {
      if (video.videoWidth) return resolve();
      video.addEventListener("loadedmetadata", resolve, { once: true });
    });

    // setInterval is reliable in hidden windows (RAF throttles to 1fps when hidden)
    _timer = setInterval(() => {
      if (!video.videoWidth || !video.videoHeight) return;
      canvas.width  = Math.round(video.videoWidth  / 2);
      canvas.height = Math.round(video.videoHeight / 2);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL("image/jpeg", 0.5);
      ipcRenderer.send("stardesk:stream-frame", {
        viewerClientId, data,
        w:  canvas.width,
        h:  canvas.height,
        sw: screenInfo.width,
        sh: screenInfo.height,
      });
    }, 50); // 20fps — getUserMedia gives real-time frames (no OS cache like getSources)
  }

  // Stop signal
  ipcRenderer.on("stardesk:stop-capture", () => {
    if (_timer) { clearInterval(_timer); _timer = null; }
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  });

  // Start immediately
  startCapture();
</script>
</body>
</html>
