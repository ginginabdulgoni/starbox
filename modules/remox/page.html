          /* ── No-tabs: terminal hidden, sidebar full-width ── */
          .rmx-workspace.no-tabs .rmx-terminal-area { display: none; }
          .rmx-workspace.no-tabs .rmx-resize-handle  { display: none; }
          .rmx-workspace.no-tabs .rmx-sidebar { width: 100% !important; max-width: none; border-right: none; }

          /* ── Compact layout mode ── */
          .rmx-sidebar:not(.layout-detail) .rmx-conn-item {
            margin: 6px 8px;
            padding: 9px 10px;
            gap: 7px;
            border: 1px solid rgba(139,92,246,0.12);
            border-left-width: 3px;
            border-radius: 10px;
            background: rgba(139,92,246,0.04);
          }
          .rmx-sidebar:not(.layout-detail) .rmx-conn-icon {
            width: 26px; height: 26px; font-size: 12px; border-radius: 5px;
          }
          .rmx-sidebar:not(.layout-detail) .rmx-conn-name { font-size: 12px; }
          .rmx-sidebar:not(.layout-detail) .rmx-ping-badge { font-size: 9px; padding: 2px 5px; }
          .rmx-sidebar:not(.layout-detail) .rmx-conn-actions { opacity: 1; }
          .rmx-sidebar:not(.layout-detail) .rmx-conn-meta { margin-top: 2px; }

          /* ── Detail layout mode ── */
          .rmx-sidebar.layout-detail .rmx-conn-item {
            padding: 11px 12px;
            align-items: flex-start;
            border-left-width: 4px;
            border-bottom: 1px solid rgba(139,92,246,0.09);
          }
          .rmx-sidebar.layout-detail .rmx-conn-item:hover { background: rgba(139,92,246,0.12); }
          .rmx-sidebar.layout-detail .rmx-conn-icon {
            width: 34px; height: 34px; font-size: 15px; margin-top: 2px;
          }
          .rmx-sidebar.layout-detail .rmx-conn-name {
            white-space: normal; font-size: 13px; line-height: 1.35;
          }
          .rmx-sidebar.layout-detail .rmx-conn-meta {
            display: block;
            white-space: normal; overflow: visible; text-overflow: initial;
            font-size: 11px; line-height: 1.45; margin-top: 3px;
            color: rgba(148,163,184,0.95);
          }
          .rmx-sidebar.layout-detail .rmx-conn-actions { opacity: 1; }
          .rmx-sidebar.layout-detail .rmx-conn-btn {
            background: rgba(139,92,246,0.14);
            color: #c4b5fd;
          }
          .rmx-sidebar.layout-detail .rmx-conn-btn:hover {
            background: rgba(139,92,246,0.25);
            color: #efe7ff;
          }
          body.theme-mode-light .rmx-sidebar.layout-detail .rmx-conn-item {
            border-bottom-color: rgba(99,102,241,0.12);
          }
          body.theme-mode-light .rmx-sidebar.layout-detail .rmx-conn-meta {
            color: #64748b;
          }

          /* ── Layout toggle active state ── */
          .rmx-layout-btn.active { background: rgba(139,92,246,0.18); color: var(--color-text-light); }

          /* ── Cloud access banner ── */
          .rmx-cloud-banner {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 16px; flex-shrink: 0;
            background: rgba(99,102,241,0.1);
            border-bottom: 1px solid rgba(99,102,241,0.2);
            font-size: 12px; color: #a5b4fc;
          }
          .rmx-cloud-banner.warn {
            background: rgba(240,160,64,0.1);
            border-bottom-color: rgba(240,160,64,0.25);
            color: #f0a040;
          }
        </style>

        <div class="rmx-topbar">
          <i class="bi bi-terminal-fill" style="color:#7c6fe0;font-size:18px"></i>
          <h2>Remox — Remote Terminal</h2>
          <div class="rmx-topbar-actions">
            <span class="rmx-quota-badge" id="rmxQuotaBadge" style="display:none" title="Kuota cloud Remox"></span>
            <button class="rmx-sync-btn" id="rmxPullBtn" onclick="rmxPullCloud()" title="Tarik koneksi dari server ke lokal">
              <i class="bi bi-cloud-arrow-down-fill"></i> Tarik dari Server
            </button>
            <button class="rmx-sync-btn" id="rmxSyncBtn" onclick="rmxSyncCloud()" title="Sinkron koneksi lokal ke server">
              <i class="bi bi-cloud-arrow-up-fill"></i> Sinkron Cloud
            </button>
            <button class="btn-icon" onclick="rmxOpenAddModal()" data-i18n-title="remox.add_connection.title" title="Add Connection">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        </div>

        <!-- Cloud access banner -->
        <div id="rmxCloudBanner" class="rmx-cloud-banner" style="display:none;">
          <i class="bi bi-cloud-slash-fill" style="font-size:14px;flex-shrink:0;"></i>
          <span id="rmxCloudBannerText"></span>
          <a id="rmxCloudBannerLoginBtn" href="#" onclick="event.preventDefault();document.querySelector('[data-label=Login],[data-action=login]')?.click()" style="display:none;margin-left:auto;font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(99,102,241,0.2);color:#a5b4fc;text-decoration:none;">Masuk / Daftar</a>
          <span id="rmxCloudBannerUpgradeBtn" style="display:none;margin-left:auto;font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(240,160,64,0.2);color:#f0a040;cursor:pointer;" onclick="openPackageModal?.()">Lihat Paket</span>
        </div>

        <div class="rmx-workspace">
          <!-- Sidebar -->
          <div class="rmx-sidebar" id="rmxSidebar">
            <div class="rmx-sidebar-head">
              <span data-i18n="remox.connections">KONEKSI</span>
              <div style="display:flex;align-items:center;gap:2px;margin-left:auto;">
                <button class="rmx-conn-btn rmx-layout-btn active" id="rmxLayoutCompactBtn" onclick="rmxSetLayout('compact')" title="Tampilan card">
                  <i class="bi bi-list-ul"></i>
                </button>
                <button class="rmx-conn-btn rmx-layout-btn" id="rmxLayoutDetailBtn" onclick="rmxSetLayout('detail')" title="Tampilan detail (label penuh)">
                  <i class="bi bi-card-list"></i>
                </button>
                <button class="rmx-conn-btn" onclick="rmxOpenAddModal()" data-i18n-title="remox.add_new.title" title="Tambah koneksi baru" style="margin-left:4px;">
                  <i class="bi bi-plus"></i>
                </button>
              </div>
            </div>
            <div class="rmx-search-wrap">
              <i class="bi bi-search"></i>
              <input id="rmxSearch" type="search" placeholder="Cari nama, IP, grup..."
                oninput="rmxSetSearch(this.value.trim())">
            </div>
            <div class="rmx-conn-list" id="rmxConnList">
              <div class="rmx-conn-empty" data-i18n="remox.empty">No saved connections.</div>
            </div>
          </div>

          <!-- Resizable divider -->
          <div class="rmx-resize-handle" id="rmxResizeHandle" title="Geser untuk ubah lebar sidebar"></div>

          <!-- Terminal area -->
          <div class="rmx-terminal-area">
            <div class="rmx-quickbar" id="rmxQuickbar">
              <span class="rmx-quickbar-label">NOC Tools</span>
              <div class="rmx-quickbar-spacer"></div>
              <div class="rmx-quickbar-dropdown">
                <button
                  type="button"
                  class="rmx-quickbar-toggle"
                  id="rmxQuickbarToggle"
                  onclick="rmxToggleQuickbarMenu(event)"
                  aria-expanded="false"
                >
                  <i class="bi bi-lightning-charge"></i>
                  <span>Quick Actions</span>
                  <i class="bi bi-chevron-down"></i>
                </button>
                <div class="rmx-quickbar-menu" id="rmxQuickbarMenu">
                  <div class="rmx-quickbar-grid">
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('health')">
                      <i class="bi bi-activity"></i><span>Health</span><kbd>Ctrl+Shift+1</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('disk')">
                      <i class="bi bi-device-hdd"></i><span>Disk</span><kbd>Ctrl+Shift+2</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('memory')">
                      <i class="bi bi-memory"></i><span>Memory</span><kbd>Ctrl+Shift+3</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('network')">
                      <i class="bi bi-diagram-3"></i><span>Network</span><kbd>Ctrl+Shift+4</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('services')">
                      <i class="bi bi-gear-wide-connected"></i><span>Services</span><kbd>Ctrl+Shift+5</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('logs')">
                      <i class="bi bi-journal-text"></i><span>Logs</span><kbd>Ctrl+Shift+6</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('docker')">
                      <i class="bi bi-box-seam"></i><span>Docker</span><kbd>Ctrl+Shift+7</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('update')">
                      <i class="bi bi-arrow-repeat"></i><span>Update</span><kbd>Ctrl+Shift+8</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('uptime')">
                      <i class="bi bi-clock-history"></i><span>Uptime</span><kbd>Ctrl+Shift+9</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn" onclick="rmxRunQuickAction('ports')">
                      <i class="bi bi-broadcast-pin"></i><span>Ports</span><kbd>Ctrl+Shift+0</kbd>
                    </button>
                    <button type="button" class="rmx-quick-btn help" onclick="rmxShowShortcutHelp()">
                      <i class="bi bi-keyboard"></i><span>Shortcut</span><kbd>Ctrl+Shift+/</kbd>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="rmx-tabs" id="rmxTabs">
              <div class="rmx-tab-add" id="rmxTabAddBtn" onclick="rmxOpenTabModal()" title="Buka koneksi baru">+</div>
            </div>
            <div class="rmx-terminal-panels" id="rmxPanels">
              <div class="rmx-splash" id="rmxSplash">
                <i class="bi bi-terminal"></i>
                <h3>Remox Terminal</h3>
                <p data-i18n="remox.splash">Select a connection in the sidebar then click <strong>Connect</strong> to open a terminal session.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Add/Edit Connection Modal -->
        <div id="rmxModal" class="rmx-modal-overlay" style="display:none;">
          <div class="rmx-modal-card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
              <h3 id="rmxModalTitle" data-i18n="remox.modal.add" style="margin:0;font-size:16px;font-weight:600;color:#e0e0e0">Add Connection</h3>
              <button onclick="rmxCloseModal()" style="background:none;border:none;color:#888;cursor:pointer;font-size:18px">
                <i class="bi bi-x"></i>
              </button>
            </div>
            <input type="hidden" id="rmxEditId" value="">
            <div class="rmx-form-row">
              <div class="rmx-form-group" style="flex:2">
                <label data-i18n="remox.form.name">Connection Name</label>
                <input type="text" id="rmxFormName" placeholder="contoh: Web Server Production">
              </div>
              <div class="rmx-form-group" style="flex:1">
                <label>Group <span style="font-size:10px;color:#666;font-weight:400">(opsional)</span></label>
                <div style="display: flex; gap: 5px;">
                  <select id="rmxFormGroup" style="flex: 1;">
                    <option value="">Tanpa group</option>
                  </select>
                  <button type="button" onclick="rmxAddNewGroup()" class="btn-secondary" style="padding: 0 12px;" title="Buat grup baru">
                    <i class="bi bi-plus-lg"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="rmx-form-row">
              <div class="rmx-form-group">
                <label data-i18n="remox.form.type">Type</label>
                <select id="rmxFormType" onchange="rmxOnTypeChange()">
                  <option value="ssh">SSH</option>
                  <option value="telnet">Telnet</option>
                  <option value="rdp">RDP (Windows)</option>
                </select>
              </div>
              <div class="rmx-form-group" style="flex:2">
                <label data-i18n="remox.form.host">Host / IP</label>
                <input type="text" id="rmxFormHost" placeholder="192.168.1.1 atau domain.com">
              </div>
              <div class="rmx-form-group" style="flex:0 0 80px">
                <label data-i18n="remox.form.port">Port</label>
                <input type="number" id="rmxFormPort" value="22" min="1" max="65535">
              </div>
            </div>
            <div id="rmxSshFields">
              <div class="rmx-form-row">
                <div class="rmx-form-group">
                  <label data-i18n="remox.form.user">Username</label>
                  <input type="text" id="rmxFormUser" placeholder="root">
                </div>
                <div class="rmx-form-group">
                  <label>Password <span class="rmx-pk-toggle" id="rmxPkToggleBtn" data-i18n="remox.form.pk_toggle" onclick="rmxTogglePk()">or Use Private Key</span></label>
                  <div class="rmx-pass-wrap">
                    <input type="password" id="rmxFormPass" placeholder="••••••••">
                    <button type="button" class="rmx-pass-toggle" id="rmxPassToggleBtn" onclick="rmxTogglePasswordVisibility()" title="Show password" aria-label="Show password">
                      <i class="bi bi-eye" id="rmxPassToggleIcon"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div id="rmxRdpFields" style="display:none">
                <div class="rmx-form-group">
                  <label data-i18n="remox.form.domain">Domain</label>
                  <input type="text" id="rmxFormDomain" placeholder="WORKGROUP ou nome de domínio">
                </div>
              </div>
              <div id="rmxPkField" class="rmx-form-group">
                <label data-i18n="remox.form.pk">Private Key (paste content of .pem / id_rsa file)</label>
                <textarea id="rmxFormPk" rows="4" placeholder="-----BEGIN RSA PRIVATE KEY-----&#10;..."></textarea>
              </div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
              <button onclick="rmxCloseModal()" class="btn-secondary" data-i18n="remox.form.cancel" style="padding:8px 20px;border-radius:8px">Cancel</button>
              <button onclick="rmxSaveConnection()" class="btn-primary" style="padding:8px 20px;border-radius:8px">
                <i class="bi bi-floppy"></i> <span data-i18n="remox.form.save">Save</span>
              </button>
            </div>
          </div>
        </div>
        <!-- Tab Connect Modal -->
        <div id="rmxTabModal">
          <div class="rmx-tab-modal-box">
            <div class="rmx-tab-modal-head">
              <span><i class="bi bi-plug" style="color:#7c6fe0;margin-right:6px"></i>Buka Koneksi</span>
              <button class="rmx-tab-modal-close" onclick="rmxCloseTabModal()"><i class="bi bi-x"></i></button>
            </div>
            <div class="rmx-tab-modal-body" id="rmxTabModalBody"></div>
          </div>
        </div>
      </div>
      <!-- End Page: Remox -->
