<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Android Remote Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0f3460;
        color: #eee;
        overflow: hidden;
        height: 100vh;
        min-width: 230px;
        width: 100%;
      }

      #sidebar {
        width: 100%;
        background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
        border-left: 1px solid rgba(61, 220, 132, 0.2);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        gap: 8px;
        overflow-y: auto;
      }

      .sidebar-header {
        text-align: center;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 8px;
      }
      .token-row {
        margin-top: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 10px;
        color: #cbd5f5;
      }

      .token-label {
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
      }

      #deviceToken {
        font-size: 11px;
        color: #9adcfb;
        user-select: all;
        max-width: 120px;
        word-break: break-all;
      }

      #btnCopyToken {
        background: rgba(59, 130, 246, 0.15);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.4);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 10px;
        cursor: pointer;
      }

      #btnCopyToken:hover {
        background: rgba(59, 130, 246, 0.25);
      }

      .sidebar-header h2 {
        font-size: 16px;
        color: #3ddc84;
        margin-bottom: 4px;
      }

      .sidebar-header .device-name {
        font-size: 11px;
        color: #999;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .control-btn {
        background: linear-gradient(135deg, #3ddc84 0%, #2ecc71 100%);
        color: #000;
        border: none;
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(61, 220, 132, 0.3);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        align-self: flex-start;
        min-width: auto;
        max-width: none;
      }

      .control-group {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
        gap: 8px;
        padding-left: 4px;
        justify-content: flex-start;
        margin-bottom: 6px;
      }

      .control-btn:hover {
        background: linear-gradient(135deg, #32c972 0%, #27ae60 100%);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(61, 220, 132, 0.4);
      }

      .control-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 6px rgba(61, 220, 132, 0.3);
      }

      .control-btn:disabled {
        background: #555;
        cursor: not-allowed;
        opacity: 0.5;
        box-shadow: none;
      }

      .control-btn.danger {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
      }

      .control-btn.danger:hover {
        background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
      }

      .control-btn.secondary {
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        box-shadow: 0 2px 8px rgba(52, 152, 219, 0.3);
      }

      .control-btn.secondary:hover {
        background: linear-gradient(135deg, #2980b9 0%, #1f6ca1 100%);
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
      }

      .btn-icon {
        font-size: 14px;
      }

      .section-label {
        font-size: 10px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 12px;
        margin-bottom: 4px;
        padding-left: 4px;
      }

      .recording-indicator {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        background: rgba(231, 76, 60, 0.2);
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .recording-indicator.active {
        display: flex;
      }

      .recording-dot {
        width: 8px;
        height: 8px;
        background: #e74c3c;
        border-radius: 50%;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .recording-text {
        font-size: 11px;
        color: #e74c3c;
        font-weight: 600;
      }

      .readonly-banner {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: rgba(251, 191, 36, 0.15);
        border: 1px solid rgba(251, 191, 36, 0.4);
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 11px;
        line-height: 1.4;
        color: #fde68a;
      }

      .readonly-banner.active {
        display: flex;
      }

      .status-message {
        font-size: 11px;
        color: #3ddc84;
        text-align: center;
        padding: 8px;
        background: rgba(61, 220, 132, 0.1);
        border-radius: 6px;
        margin-top: auto;
        display: none;
      }

      .status-message.show {
        display: block;
      }

      .pending-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        gap: 6px;
      }

      .pending-loading {
        font-size: 11px;
        color: #3ddc84;
        display: none;
      }

      .pending-status {
        font-size: 11px;
        color: #f9a8d4;
        text-align: right;
        flex: 1;
      }

      .pending-empty {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        padding: 8px;
        background: rgba(123, 150, 225, 0.12);
        border-radius: 8px;
        margin-top: 8px;
        display: none;
      }

      .pending-list {
        margin-top: 8px;
        max-height: 38vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pending-item {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(123, 150, 225, 0.25);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: all 0.3s ease-out;
      }

      /* Animasi untuk pesan yang terkirim (akan dihapus dari list) */
      .pending-item.removing {
        opacity: 0;
        transform: translateX(20px);
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        margin-bottom: 0;
        overflow: hidden;
      }

      .pending-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .pending-phone {
        font-weight: 600;
        font-size: 12px;
        color: #e2e8f0;
      }

      .pending-status-tag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        text-transform: capitalize;
      }

      .pending-pending {
        background: rgba(250, 204, 21, 0.25);
        color: #fde68a;
      }

      .pending-success {
        background: rgba(52, 211, 153, 0.25);
        color: #6ee7b7;
      }

      .pending-failed,
      .pending-error {
        background: rgba(248, 113, 113, 0.25);
        color: #fca5a5;
      }

      .pending-message {
        font-size: 12px;
        line-height: 1.4;
        color: rgba(226, 232, 240, 0.9);
        white-space: pre-wrap;
      }

      .rate-limit-control {
        margin-top: 8px;
        padding: 8px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(123, 150, 225, 0.25);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .rate-limit-label {
        font-size: 10px;
        color: #cbd5f5;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }

      .rate-limit-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .rate-limit-input {
        flex: 1;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(123, 150, 225, 0.3);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        color: #e2e8f0;
        text-align: center;
      }

      .rate-limit-input:focus {
        outline: none;
        border-color: rgba(59, 130, 246, 0.6);
      }

      .rate-limit-unit {
        font-size: 11px;
        color: #94a3b8;
      }

      .countdown-display {
        font-size: 11px;
        color: #fbbf24;
        text-align: center;
        padding: 4px 8px;
        background: rgba(251, 191, 36, 0.15);
        border-radius: 6px;
        font-family: 'Courier New', monospace;
      }

      /* Scrollbar styling */
      #sidebar::-webkit-scrollbar {
        width: 6px;
      }

      #sidebar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 3px;
      }

      #sidebar::-webkit-scrollbar-thumb {
        background: rgba(61, 220, 132, 0.3);
        border-radius: 3px;
      }

      #sidebar::-webkit-scrollbar-thumb:hover {
        background: rgba(61, 220, 132, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="sidebar-header">
        <h2>Remote Control</h2>
        <div class="device-name" id="deviceName">Android Device</div>
        <div class="token-row">
          <span class="token-label">Token:</span>
          <span id="deviceToken">-</span>
          <button id="btnCopyToken">Copy</button>
        </div>
      </div>

      <div class="readonly-banner" id="readonlyBanner">
        <span>🔒</span>
        <span
          >Mode Read-Only — WhatsApp Automation aktif. Layar emulator hanya
          bisa dilihat agar pengiriman pesan tidak terganggu.</span
        >
      </div>

      <div id="remoteControlsContainer">
        <div class="recording-indicator" id="recordingIndicator">
          <div class="recording-dot"></div>
          <span class="recording-text">Recording...</span>
        </div>

        <div class="control-group">
          <button class="control-btn" id="btnWake" title="Wake screen">
            <span class="btn-icon">☀️</span>
            <span>Wake</span>
          </button>
          <button class="control-btn" id="btnUnlock" title="Unlock device">
            <span class="btn-icon">🔓</span>
            <span>Unlock</span>
          </button>
        </div>

        <div class="control-group">
          <button class="control-btn secondary" id="btnBack" title="Back button">
            <span class="btn-icon">◀</span>
            <span>Back</span>
          </button>
          <button class="control-btn secondary" id="btnHome" title="Home button">
            <span class="btn-icon">🏠</span>
            <span>Home</span>
          </button>
          <button
            class="control-btn secondary"
            id="btnRecent"
            title="Recent apps"
          >
            <span class="btn-icon">📱</span>
            <span>Recent</span>
          </button>
        </div>

        <div class="control-group">
          <button class="control-btn" id="btnRotate" title="Rotate screen">
            <span class="btn-icon">🔄</span>
            <span>Rotate</span>
          </button>
          <button class="control-btn" id="btnScreenshot" title="Take screenshot">
            <span class="btn-icon">📸</span>
            <span>Screenshot</span>
          </button>
        </div>

        <div class="control-group">
          <button class="control-btn" id="btnRecord" title="Start recording">
            <span class="btn-icon">⏺</span>
            <span>Record</span>
          </button>
          <button
            class="control-btn danger"
            id="btnStopRecord"
            style="display: none"
            title="Stop recording"
          >
            <span class="btn-icon">⏹</span>
            <span>Stop Rec</span>
          </button>
        </div>

        <div class="control-group">
          <button
            class="control-btn secondary"
            id="btnVolumeUp"
            title="Volume up"
          >
            <span class="btn-icon">🔊</span>
            <span>Vol +</span>
          </button>
          <button
            class="control-btn secondary"
            id="btnVolumeDown"
            title="Volume down"
          >
            <span class="btn-icon">🔉</span>
            <span>Vol -</span>
          </button>
        </div>
      </div>

      <div id="whatsappPendingSection" style="display: none">
        <div class="section-label">Pending Messages</div>
        <div class="control-group">
          <button
            class="control-btn secondary"
            id="btnRefreshPending"
            title="Refresh pending messages"
          >
            <span class="btn-icon">🔄</span>
            <span>Refresh Pending</span>
          </button>
        </div>

        <div class="rate-limit-control">
          <div class="rate-limit-label">Rate Limiting</div>
          <div class="rate-limit-input-row">
            <input
              type="number"
              id="rateLimitInput"
              class="rate-limit-input"
              min="1"
              max="60"
              value="2"
              title="Jumlah pesan per menit"
            />
            <span class="rate-limit-unit">pesan/menit</span>
          </div>
          <div class="countdown-display" id="nextRefreshCountdown" style="display: none;">
            Refresh berikutnya: <span id="refreshTimer">60</span>s
          </div>
          <div class="countdown-display" id="nextMessageCountdown" style="display: none;">
            Pesan berikutnya: <span id="messageTimer">0</span>s
          </div>
        </div>

        <div class="pending-info">
          <span class="pending-loading" id="pendingLoading">Memuat...</span>
          <span class="pending-status" id="pendingStatusText"></span>
        </div>
        <div class="pending-empty" id="pendingEmptyState">
          Belum ada pesan pending.
        </div>
        <div class="pending-list" id="pendingMessageList"></div>
      </div>

      <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const uid = params.get("uid") || "";
        const deviceName = params.get("deviceName") || "Android Device";
        const adbId = params.get("adbId") || "";
        const serviceKey = (params.get("service") || "").toLowerCase();
        const isWhatsAppRemote = serviceKey === "android-whatsapp";
        const displayMode = (params.get("displayMode") || "readonly").toLowerCase();
        const isReadonlyRemote = isWhatsAppRemote && displayMode !== "native";
        const whatsappBaseUrlRaw = params.get("whatsappBaseUrl") || "";
        const whatsappCallbackUrlRaw = params.get("whatsappCallbackUrl") || "";

          function sanitizePendingUrl(url = "") {
            return String(url || "").trim().replace(/\/+$/, "");
          }

          function extractUrlRoot(url = "") {
            const sanitized = sanitizePendingUrl(url);
            if (!sanitized) return "";
            try {
              const parsed = new URL(sanitized);
              return `${parsed.protocol}//${parsed.host}`;
            } catch {
              const match = sanitized.match(/^([a-z]+:\/\/[^/]+)/i);
              return match ? match[1].replace(/\/+$/, "") : sanitized;
            }
          }

        function hasCustomPathInUrl(url = "") {
          if (!url) return false;
          try {
            const parsed = new URL(url);
            const path = (parsed.pathname || "").replace(/\/+$/, "");
            return Boolean(path && path !== "/");
          } catch {
            const withoutProtocol = String(url).replace(/^[a-z]+:\/\//i, "");
            return withoutProtocol.includes("/");
          }
        }

        function buildUrlWithDefaultPath(baseUrl = "", defaultPath = "") {
          const sanitized = sanitizePendingUrl(baseUrl);
          if (!sanitized) return "";
          const normalizedPath = defaultPath.startsWith("/")
            ? defaultPath
            : `/${defaultPath}`;
          if (hasCustomPathInUrl(sanitized)) {
            return sanitized;
          }
          try {
            const parsed = new URL(sanitized);
            if (!parsed.pathname || parsed.pathname === "/") {
              parsed.pathname = normalizedPath;
            }
            parsed.search = "";
            parsed.hash = "";
            return parsed.toString().replace(/\/+$/, "");
          } catch {
            return `${sanitized}${normalizedPath}`;
          }
        }

        const whatsappBaseUrl = buildUrlWithDefaultPath(
          whatsappBaseUrlRaw,
          "/schedule/getpendingmessage"
        );
          const whatsappCallbackUrl = buildUrlWithDefaultPath(
            whatsappCallbackUrlRaw || extractUrlRoot(whatsappBaseUrlRaw),
            "/schedule/updatestatusmessage"
          );

        // Update device name
        document.getElementById("deviceName").textContent = deviceName;
        const tokenEl = document.getElementById("deviceToken");
        if (tokenEl) tokenEl.textContent = uid || "-";

        const copyBtn = document.getElementById("btnCopyToken");
        if (copyBtn) {
          copyBtn.addEventListener("click", () => {
            if (!uid) return;
            if (window.electronAPI?.androidRemote?.copyToClipboard) {
              window.electronAPI.androidRemote
                .copyToClipboard(uid)
                .then(() => showStatus("Token disalin ke clipboard", 2000))
                .catch(() => showStatus("Gagal menyalin token.", 2000));
            }
          });
        }

        const statusMessage = document.getElementById("statusMessage");
        const recordingIndicator =
          document.getElementById("recordingIndicator");
        const btnRecord = document.getElementById("btnRecord");
        const btnStopRecord = document.getElementById("btnStopRecord");
        const pendingSection = document.getElementById(
          "whatsappPendingSection"
        );
        const pendingList = document.getElementById("pendingMessageList");
        const pendingEmptyState = document.getElementById("pendingEmptyState");
        const pendingLoading = document.getElementById("pendingLoading");
        const pendingStatusText = document.getElementById("pendingStatusText");
        const pendingRefreshBtn = document.getElementById("btnRefreshPending");
        const rateLimitInput = document.getElementById("rateLimitInput");
        const refreshTimerEl = document.getElementById("refreshTimer");
        const messageTimerEl = document.getElementById("messageTimer");
        const nextRefreshCountdown = document.getElementById("nextRefreshCountdown");
        const nextMessageCountdown = document.getElementById("nextMessageCountdown");

        // Mode read-only saat WhatsApp automation: sembunyikan tombol yang
        // bisa dipakai berpindah aplikasi (Back/Home/Recent/Rotate) supaya
        // pengiriman pesan pending tidak terganggu. Layar scrcpy juga
        // diluncurkan dengan --no-control dari main process. Mode "native"
        // (kontrol penuh) tetap menampilkan semua tombol.
        if (isReadonlyRemote) {
          const banner = document.getElementById("readonlyBanner");
          if (banner) banner.classList.add("active");
          ["btnBack", "btnHome", "btnRecent", "btnRotate"].forEach((id) => {
            const btn = document.getElementById(id);
            if (btn) btn.style.display = "none";
          });
          // Sembunyikan group navigasi yang jadi kosong
          const backBtn = document.getElementById("btnBack");
          const navGroup = backBtn ? backBtn.closest(".control-group") : null;
          if (navGroup) navGroup.style.display = "none";
        }

        let isRecording = false;
        let pendingMessagesCache = [];
        let autoSendingPending = false;
        const PENDING_LIMIT = 20;

        // Auto-refresh and rate limiting state
        let autoRefreshInterval = null;
        let refreshCountdownInterval = null;
        let messageCountdownInterval = null;
        let refreshSecondsLeft = 60;
        let messageSecondsLeft = 0;
        const AUTO_REFRESH_INTERVAL = 60000; // 60 seconds

        function showStatus(message, duration = 2000) {
          statusMessage.textContent = message;
          statusMessage.classList.add("show");
          setTimeout(() => {
            statusMessage.classList.remove("show");
          }, duration);
        }

        function startRefreshCountdown() {
          refreshSecondsLeft = 60;
          if (nextRefreshCountdown) nextRefreshCountdown.style.display = 'block';

          if (refreshCountdownInterval) clearInterval(refreshCountdownInterval);
          refreshCountdownInterval = setInterval(() => {
            refreshSecondsLeft--;
            if (refreshTimerEl) refreshTimerEl.textContent = refreshSecondsLeft;
            if (refreshSecondsLeft <= 0) {
              refreshSecondsLeft = 60;
            }
          }, 1000);
        }

        function startMessageCountdown(seconds) {
          messageSecondsLeft = seconds;
          if (nextMessageCountdown) nextMessageCountdown.style.display = 'block';
          if (messageTimerEl) messageTimerEl.textContent = messageSecondsLeft;

          if (messageCountdownInterval) clearInterval(messageCountdownInterval);
          messageCountdownInterval = setInterval(() => {
            messageSecondsLeft--;
            if (messageTimerEl) messageTimerEl.textContent = Math.max(0, messageSecondsLeft);
            if (messageSecondsLeft <= 0) {
              if (messageCountdownInterval) clearInterval(messageCountdownInterval);
              if (nextMessageCountdown) nextMessageCountdown.style.display = 'none';
            }
          }, 1000);
        }

        async function postToCallback(messageId, status) {
          if (!whatsappCallbackUrl || !messageId) return;
          try {
            await fetch(whatsappCallbackUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: messageId, status: status })
            });
            console.log(`✅ Callback posted: ${messageId} -> ${status}`);
          } catch (err) {
            console.warn('⚠️ Callback post failed:', err);
          }
        }

        async function fetchPendingMessagesViaRenderer() {
          if (!whatsappBaseUrl) return null;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            const response = await fetch(whatsappBaseUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ uid }),
              signal: controller.signal,
            });
            clearTimeout(timeout);
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json().catch(() => ({}));
            const messages = Array.isArray(data)
              ? data
              : Array.isArray(data?.data)
              ? data.data
              : [];
            return { success: true, messages };
          } catch (err) {
            console.warn("⚠️ Renderer fetch pending failed:", err);
            return {
              success: false,
              allowFallback: true,
              message: err?.message || "Renderer fetch failed",
            };
          }
        }

        function renderPendingMessages(messages = []) {
          if (!pendingList) return;
          pendingList.innerHTML = "";
          if (!messages.length) {
            pendingEmptyState.style.display = "block";
            return;
          }
          const fragment = document.createDocumentFragment();
          messages.forEach((message) => {
            const phone = message?.phone || message?.uid || "-";
            const body = message?.message || "";
            const status = (message?.status || "pending").toLowerCase();
            const messageId = message?.id || message?.messageId;

            const item = document.createElement("div");
            item.className = "pending-item";

            // Simpan message ID sebagai data attribute untuk tracking status
            if (messageId) {
              item.setAttribute("data-message-id", messageId);
            }

            const meta = document.createElement("div");
            meta.className = "pending-meta";
            const phoneEl = document.createElement("span");
            phoneEl.className = "pending-phone";
            phoneEl.textContent = phone;
            const statusEl = document.createElement("span");
            statusEl.className = `pending-status-tag pending-${status}`;
            statusEl.textContent = status;
            meta.appendChild(phoneEl);
            meta.appendChild(statusEl);

            const messageEl = document.createElement("div");
            messageEl.className = "pending-message";
            messageEl.textContent = body;

            item.appendChild(meta);
            item.appendChild(messageEl);
            fragment.appendChild(item);
          });
          pendingList.appendChild(fragment);
        }

        async function refreshPendingMessages(showToast = false) {
          if (!pendingSection) return;
          const canUseIpcFetch =
            !!window.electronAPI?.androidRemote?.fetchWhatsappMessages;
          pendingLoading.style.display = "inline-flex";
          pendingStatusText.textContent = "";
          pendingEmptyState.style.display = "none";
          pendingList.innerHTML = "";

          let response = null;

          if (whatsappBaseUrl) {
            const rendererResult = await fetchPendingMessagesViaRenderer();
            if (rendererResult && rendererResult.success) {
              response = rendererResult;
            } else if (
              rendererResult &&
              !rendererResult.allowFallback &&
              !rendererResult.success
            ) {
              response = rendererResult;
            }
          }

          if (!response) {
            if (!uid || !canUseIpcFetch) {
              pendingStatusText.textContent =
                "API fetch pending tidak tersedia di versi ini.";
              pendingLoading.style.display = "none";
              pendingEmptyState.style.display = "block";
              return;
            }
            response =
              await window.electronAPI.androidRemote.fetchWhatsappMessages(uid);
          }

          try {
            if (!response?.success) {
              pendingStatusText.textContent =
                response?.message || "Gagal memuat pending messages.";
              pendingEmptyState.style.display = "block";
              return;
            }
            const messages = Array.isArray(response.messages)
              ? response.messages
              : Array.isArray(response.data)
              ? response.data
              : [];
            pendingMessagesCache = messages;
            if (!messages.length) {
              pendingEmptyState.style.display = "block";
              pendingEmptyState.textContent = "Belum ada pesan pending.";
              if (showToast) {
                showStatus("Tidak ada pesan pending.", 2000);
              }
              return;
            }
            const limited = messages.slice(0, PENDING_LIMIT);
            renderPendingMessages(limited);
            autoSendPendingMessages(limited);
            if (showToast) {
              showStatus(
                `Memuat ${Math.min(messages.length, PENDING_LIMIT)} dari ${
                  messages.length
                } pesan pending.`,
                2500
              );
            }
          } catch (err) {
            console.error("⚠️ Gagal memuat pending messages:", err);
            pendingStatusText.textContent =
              err?.message || "Gagal memuat pending messages.";
            pendingEmptyState.style.display = "block";
          } finally {
            pendingLoading.style.display = "none";
          }
        }

        async function executeCommand(command, params = {}) {
          if (!window.electronAPI || !window.electronAPI.androidRemote) {
            showStatus("Error: API not available");
            return;
          }

          try {
            const result = await window.electronAPI.androidRemote[command](
              uid,
              params
            );
            if (result && result.message) {
              showStatus(result.message);
            }
            return result;
          } catch (err) {
            showStatus(err.message || "Command failed");
            console.error("Command failed:", command, err);
          }
        }

        // Power controls
        document.getElementById("btnWake").addEventListener("click", () => {
          executeCommand("wake");
        });

        document.getElementById("btnUnlock").addEventListener("click", () => {
          executeCommand("unlock");
        });

        // Navigation controls
        document.getElementById("btnBack").addEventListener("click", () => {
          executeCommand("pressBack");
        });

        document.getElementById("btnHome").addEventListener("click", () => {
          executeCommand("pressHome");
        });

        document.getElementById("btnRecent").addEventListener("click", () => {
          executeCommand("pressRecent");
        });

        // Screen controls
        document.getElementById("btnRotate").addEventListener("click", () => {
          executeCommand("rotate");
        });

        document
          .getElementById("btnScreenshot")
          .addEventListener("click", async () => {
            const result = await executeCommand("screenshot");
            if (result && result.path) {
              showStatus(`Screenshot saved: ${result.path}`, 3000);
            }
          });

        // Recording controls
        document.getElementById("btnRecord").addEventListener("click", () => {
          isRecording = true;
          btnRecord.style.display = "none";
          btnStopRecord.style.display = "flex";
          recordingIndicator.classList.add("active");
          executeCommand("startRecording");
        });

        document
          .getElementById("btnStopRecord")
          .addEventListener("click", async () => {
            isRecording = false;
            btnRecord.style.display = "flex";
            btnStopRecord.style.display = "none";
            recordingIndicator.classList.remove("active");
            const result = await executeCommand("stopRecording");
            if (result && result.path) {
              const msg = result.manualSave
                ? `Recording saved: ${result.path}`
                : `Recording kept at ${result.path}`;
              showStatus(msg, 3000);
            }
          });

        // Volume controls
        document.getElementById("btnVolumeUp").addEventListener("click", () => {
          executeCommand("volumeUp");
        });

        document
          .getElementById("btnVolumeDown")
          .addEventListener("click", () => {
            executeCommand("volumeDown");
          });

        async function sendPendingWhatsappMessage(entry) {
          if (!entry || !entry.phone || !entry.message) {
            showStatus("Data pesan tidak lengkap.", 2500);
            return;
          }
          if (!window.electronAPI?.androidRemote?.sendWhatsappMessage) {
            showStatus("Fitur kirim pesan belum tersedia.", 2500);
            return;
          }

          showStatus(`Mengirim ke ${entry.phone}...`, 2000);
          try {
            const result =
              await window.electronAPI.androidRemote.sendWhatsappMessage(uid, {
                phone: entry.phone,
                message: entry.message,
                id: entry.id,
              });
            if (result?.success) {
              showStatus(
                result.message || `Pesan dikirim ke ${entry.phone}.`,
                2500
              );
              entry.status = "sent";
              renderPendingMessages(
                pendingMessagesCache.slice(0, PENDING_LIMIT)
              );

              // POST to callback URL with status "done"
              if (entry.id) {
                postToCallback(entry.id, "done");
              }

              // Legacy: Also post via IPC if available
              if (
                entry.id &&
                window.electronAPI?.androidRemote?.postWhatsappStatus
              ) {
                window.electronAPI.androidRemote
                  .postWhatsappStatus(uid, entry.id, "sent")
                  .catch(() => {});
              }
            } else {
              showStatus(result?.message || "Gagal mengirim pesan.", 3000);
            }
          } catch (err) {
            console.error("❌ Failed to send WhatsApp message:", err);
            showStatus(err?.message || "Gagal mengirim pesan.", 3200);
          }
        }

        async function autoSendPendingMessages(list = []) {
          if (!isWhatsAppRemote || !list.length || autoSendingPending) return;
          const pendingItems = list.filter(
            (entry) => (entry.status || "pending").toLowerCase() === "pending"
          );
          if (!pendingItems.length) return;

          // Get rate limit from input (messages per minute)
          const messagesPerMinute = parseInt(rateLimitInput?.value || "2", 10);
          const delayBetweenMessages = Math.floor(60000 / Math.max(1, messagesPerMinute)); // ms

          autoSendingPending = true;
          try {
            for (let i = 0; i < pendingItems.length; i++) {
              const entry = pendingItems[i];
              await sendPendingWhatsappMessage(entry);

              // Show countdown for next message (if not last message)
              if (i < pendingItems.length - 1) {
                const delaySeconds = Math.floor(delayBetweenMessages / 1000);
                startMessageCountdown(delaySeconds);
                await new Promise((resolve) => setTimeout(resolve, delayBetweenMessages));
              }
            }
          } finally {
            autoSendingPending = false;
            if (nextMessageCountdown) nextMessageCountdown.style.display = 'none';
          }
        }

        if (pendingSection) {
          if (isWhatsAppRemote) {
            pendingSection.style.display = "block";

            // Manual refresh button
            pendingRefreshBtn?.addEventListener("click", () => {
              refreshPendingMessages(true);
              // Restart countdown after manual refresh
              startRefreshCountdown();
            });

            // Initial fetch
            refreshPendingMessages(false);

            // Start countdown
            startRefreshCountdown();

            // Auto-refresh every 60 seconds
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
              console.log('🔄 Auto-refreshing pending messages...');
              refreshPendingMessages(false);
              startRefreshCountdown();
            }, AUTO_REFRESH_INTERVAL);
          } else {
            pendingSection.style.display = "none";
          }
        }

        // Cleanup intervals on window unload
        window.addEventListener('beforeunload', () => {
          if (autoRefreshInterval) clearInterval(autoRefreshInterval);
          if (refreshCountdownInterval) clearInterval(refreshCountdownInterval);
          if (messageCountdownInterval) clearInterval(messageCountdownInterval);
        });

        // Listen for pause/resume auto-refresh events during chunk sending
        if (window.electronAPI?.androidRemote?.onPauseAutoRefresh) {
          window.electronAPI.androidRemote.onPauseAutoRefresh(() => {
            console.log('⏸️ Pausing auto-refresh during chunk sending...');
            if (autoRefreshInterval) {
              clearInterval(autoRefreshInterval);
              autoRefreshInterval = null;
            }
            if (refreshCountdownInterval) {
              clearInterval(refreshCountdownInterval);
              refreshCountdownInterval = null;
            }
            if (nextRefreshCountdown) {
              nextRefreshCountdown.style.display = 'none';
            }
          });
        }

        if (window.electronAPI?.androidRemote?.onResumeAutoRefresh) {
          window.electronAPI.androidRemote.onResumeAutoRefresh(() => {
            console.log('▶️ Resuming auto-refresh after chunk sending complete');
            // Restart auto-refresh interval
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
              console.log('🔄 Auto-refreshing pending messages...');
              refreshPendingMessages(false);
              startRefreshCountdown();
            }, AUTO_REFRESH_INTERVAL);

            // Restart countdown
            startRefreshCountdown();
          });
        }

        // Function untuk remove message dengan animasi
        function removeMessageFromList(messageId) {
          if (!messageId || !pendingList) return;

          const item = pendingList.querySelector(`[data-message-id="${messageId}"]`);
          if (!item) {
            console.log(`⚠️ Message ${messageId} not found in list`);
            return;
          }

          console.log(`✨ Removing message ${messageId} with animation...`);

          // Tambahkan class 'removing' untuk trigger animasi
          item.classList.add('removing');

          // Hapus element setelah animasi selesai (300ms)
          setTimeout(() => {
            item.remove();
            console.log(`✅ Message ${messageId} removed from list`);

            // Cek apakah list kosong
            if (pendingList.children.length === 0) {
              pendingEmptyState.style.display = 'block';
            }
          }, 300);
        }

        // Listen for automation status updates (dari main process)
        if (window.electronAPI?.androidRemote?.onAutomationUpdate) {
          window.electronAPI.androidRemote.onAutomationUpdate((payload) => {
            console.log('📨 Received automation update:', payload);

            const { messageId, status, statusText } = payload || {};

            // Jika status 'sent', hapus message dari list dengan animasi
            if (status === 'sent' && messageId) {
              console.log(`✅ Message ${messageId} sent, removing from pending list...`);
              removeMessageFromList(messageId);
            }

            // Update status tag jika message masih ada di list
            else if (messageId && status) {
              const item = pendingList?.querySelector(`[data-message-id="${messageId}"]`);
              if (item) {
                const statusTag = item.querySelector('.pending-status-tag');
                if (statusTag) {
                  statusTag.className = `pending-status-tag pending-${status}`;
                  statusTag.textContent = statusText || status;
                }
              }
            }
          });
        }

        // Log initialization
        console.log("Android Remote Control initialized", {
          uid,
          deviceName,
          adbId,
          service: serviceKey,
          rateLimit: rateLimitInput?.value || "2",
          autoRefresh: AUTO_REFRESH_INTERVAL / 1000 + "s"
        });
      })();
    </script>
  </body>
</html>
