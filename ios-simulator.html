<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Simulator Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .status-box {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
      }

      .status-text {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 5px;
      }

      .status-detail {
        font-size: 14px;
        color: #666;
      }

      .device-select {
        margin-bottom: 20px;
      }

      .device-select label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
      }

      .device-select select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        background: white;
        cursor: pointer;
        transition: border-color 0.3s;
      }

      .device-select select:hover {
        border-color: #667eea;
      }

      .device-select select:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .btn {
        flex: 1;
        min-width: 120px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        color: white;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-danger {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .btn-danger:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
      }

      .btn-secondary {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }

      .btn-secondary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .log-container {
        background: #1e1e1e;
        border-radius: 8px;
        padding: 15px;
        max-height: 300px;
        overflow-y: auto;
      }

      .log-header {
        color: #aaa;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .log-body {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
      }

      .log-entry {
        margin-bottom: 4px;
        padding: 4px 8px;
        border-radius: 4px;
      }

      .log-entry.info {
        color: #4fc3f7;
        background: rgba(79, 195, 247, 0.1);
      }

      .log-entry.success {
        color: #81c784;
        background: rgba(129, 199, 132, 0.1);
      }

      .log-entry.warn {
        color: #ffb74d;
        background: rgba(255, 183, 77, 0.1);
      }

      .log-entry.error {
        color: #e57373;
        background: rgba(229, 115, 115, 0.1);
      }

      .timestamp {
        opacity: 0.6;
        margin-right: 8px;
      }

      .info-box {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #1976d2;
      }

      .device-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .device-info-item {
        background: #f8f9fa;
        padding: 12px;
        border-radius: 8px;
      }

      .device-info-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }

      .device-info-value {
        font-size: 16px;
        font-weight: 600;
        color: #333;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .loading {
        animation: pulse 1.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>iOS Simulator Manager</h1>
      <p class="subtitle">Kelola dan jalankan iOS simulators dengan cepat (Native ARM Performance)</p>

      <div class="info-box" id="info-box">
        Boot time: ~5-10 detik | Performance: Native Speed
      </div>

      <div class="status-box">
        <div class="status-text" id="status-text">Memuat...</div>
        <div class="status-detail" id="status-detail">Memeriksa iOS simulators...</div>
      </div>

      <div class="device-select">
        <label for="device-dropdown">Pilih iOS Simulator:</label>
        <select id="device-dropdown" disabled>
          <option value="">Memuat devices...</option>
        </select>
      </div>

      <div class="device-info" id="device-info" style="display: none;">
        <div class="device-info-item">
          <div class="device-info-label">Device</div>
          <div class="device-info-value" id="info-name">-</div>
        </div>
        <div class="device-info-item">
          <div class="device-info-label">Runtime</div>
          <div class="device-info-value" id="info-runtime">-</div>
        </div>
        <div class="device-info-item">
          <div class="device-info-label">Status</div>
          <div class="device-info-value" id="info-state">-</div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="boot-btn" disabled>Boot Simulator</button>
        <button class="btn btn-danger" id="shutdown-btn" disabled>Shutdown</button>
        <button class="btn btn-secondary" id="refresh-btn">Refresh List</button>
      </div>

      <div class="log-container">
        <div class="log-header">Activity Log</div>
        <div class="log-body" id="log-body"></div>
      </div>
    </div>

    <script>
      const uid = "ios-simulator";
      let currentDevices = [];
      let selectedDeviceUDID = null;

      const statusText = document.getElementById("status-text");
      const statusDetail = document.getElementById("status-detail");
      const deviceDropdown = document.getElementById("device-dropdown");
      const bootBtn = document.getElementById("boot-btn");
      const shutdownBtn = document.getElementById("shutdown-btn");
      const refreshBtn = document.getElementById("refresh-btn");
      const logBody = document.getElementById("log-body");
      const deviceInfo = document.getElementById("device-info");

      function appendLog(type, message) {
        const timestamp = new Date().toLocaleTimeString("id-ID");
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
        logBody.appendChild(entry);
        logBody.scrollTop = logBody.scrollHeight;
      }

      function resetLog() {
        logBody.innerHTML = "";
      }

      async function loadDevices() {
        try {
          appendLog("info", "Memuat daftar iOS simulators...");
          const result = await electronAPI.ios.getDevices();

          if (result.success && result.devices) {
            currentDevices = result.devices;
            deviceDropdown.innerHTML = "";

            if (currentDevices.length === 0) {
              deviceDropdown.innerHTML = '<option value="">Tidak ada simulator tersedia</option>';
              appendLog("warn", "Tidak ditemukan iOS simulator. Install via Xcode.");
              statusText.textContent = "Tidak Ada Simulator";
              statusDetail.textContent = "Install iOS Simulator dari Xcode";
              return;
            }

            // Add options
            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "-- Pilih Simulator --";
            deviceDropdown.appendChild(placeholder);

            currentDevices.forEach(device => {
              const option = document.createElement("option");
              option.value = device.udid;
              option.textContent = `${device.name} (${device.runtime}) - ${device.state}`;
              option.dataset.state = device.state;
              deviceDropdown.appendChild(option);
            });

            deviceDropdown.disabled = false;
            statusText.textContent = `${currentDevices.length} Simulator Tersedia`;
            statusDetail.textContent = "Pilih simulator dari dropdown";
            appendLog("success", `Ditemukan ${currentDevices.length} iOS simulators`);
          } else {
            throw new Error(result.error || "Failed to load devices");
          }
        } catch (err) {
          appendLog("error", `Gagal memuat devices: ${err.message}`);
          statusText.textContent = "Error";
          statusDetail.textContent = err.message;
        }
      }

      deviceDropdown.addEventListener("change", (e) => {
        selectedDeviceUDID = e.target.value;

        if (!selectedDeviceUDID) {
          bootBtn.disabled = true;
          shutdownBtn.disabled = true;
          deviceInfo.style.display = "none";
          return;
        }

        const device = currentDevices.find(d => d.udid === selectedDeviceUDID);
        if (device) {
          // Update device info
          document.getElementById("info-name").textContent = device.name;
          document.getElementById("info-runtime").textContent = device.runtime;
          document.getElementById("info-state").textContent = device.state;
          deviceInfo.style.display = "grid";

          // Update buttons based on state
          if (device.state === "Booted") {
            bootBtn.disabled = true;
            shutdownBtn.disabled = false;
            statusText.textContent = "Simulator Berjalan";
            statusDetail.textContent = device.name;
          } else {
            bootBtn.disabled = false;
            shutdownBtn.disabled = true;
            statusText.textContent = "Simulator Siap";
            statusDetail.textContent = `Klik Boot untuk menjalankan ${device.name}`;
          }

          appendLog("info", `Dipilih: ${device.name}`);
        }
      });

      bootBtn.addEventListener("click", async () => {
        if (!selectedDeviceUDID) return;

        bootBtn.disabled = true;
        refreshBtn.disabled = true;
        resetLog();
        appendLog("info", "Memulai iOS simulator...");
        statusText.textContent = "Booting...";
        statusDetail.textContent = "Tunggu 5-10 detik...";

        try {
          const result = await electronAPI.ios.boot(selectedDeviceUDID);

          if (result.success) {
            appendLog("success", "Simulator berhasil boot!");
            statusText.textContent = "Simulator Berjalan";
            statusDetail.textContent = "Simulator siap digunakan";
            bootBtn.disabled = true;
            shutdownBtn.disabled = false;

            // Update dropdown state
            const option = deviceDropdown.querySelector(`option[value="${selectedDeviceUDID}"]`);
            if (option) {
              const device = currentDevices.find(d => d.udid === selectedDeviceUDID);
              option.textContent = `${device.name} (${device.runtime}) - Booted`;
              option.dataset.state = "Booted";
            }

            // Update device info
            document.getElementById("info-state").textContent = "Booted";
          } else {
            throw new Error(result.error || "Failed to boot");
          }
        } catch (err) {
          appendLog("error", `Gagal boot simulator: ${err.message}`);
          statusText.textContent = "Boot Gagal";
          statusDetail.textContent = err.message;
          bootBtn.disabled = false;
        } finally {
          refreshBtn.disabled = false;
        }
      });

      shutdownBtn.addEventListener("click", async () => {
        if (!selectedDeviceUDID) return;

        shutdownBtn.disabled = true;
        refreshBtn.disabled = true;
        appendLog("info", "Mematikan simulator...");
        statusText.textContent = "Shutting Down...";

        try {
          const result = await electronAPI.ios.shutdown(selectedDeviceUDID);

          if (result.success) {
            appendLog("success", "Simulator berhasil dimatikan");
            statusText.textContent = "Simulator Siap";
            statusDetail.textContent = "Simulator telah dimatikan";
            bootBtn.disabled = false;
            shutdownBtn.disabled = true;

            // Update dropdown state
            const option = deviceDropdown.querySelector(`option[value="${selectedDeviceUDID}"]`);
            if (option) {
              const device = currentDevices.find(d => d.udid === selectedDeviceUDID);
              option.textContent = `${device.name} (${device.runtime}) - Shutdown`;
              option.dataset.state = "Shutdown";
            }

            // Update device info
            document.getElementById("info-state").textContent = "Shutdown";
          } else {
            throw new Error(result.error || "Failed to shutdown");
          }
        } catch (err) {
          appendLog("error", `Gagal shutdown: ${err.message}`);
        } finally {
          refreshBtn.disabled = false;
        }
      });

      refreshBtn.addEventListener("click", async () => {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "Refreshing...";
        selectedDeviceUDID = null;
        deviceDropdown.value = "";
        bootBtn.disabled = true;
        shutdownBtn.disabled = true;
        deviceInfo.style.display = "none";

        await loadDevices();

        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh List";
      });

      // Listen for boot progress
      if (electronAPI && electronAPI.ios && electronAPI.ios.onBootProgress) {
        electronAPI.ios.onBootProgress((data) => {
          const phase = data.phase || "";
          const message = data.message || "";

          if (phase === "booting") {
            appendLog("info", message);
          } else if (phase === "opening") {
            appendLog("info", message);
          } else if (phase === "boot-complete") {
            appendLog("success", message);
          } else if (phase === "error") {
            appendLog("error", message);
          } else if (phase === "already-booted") {
            appendLog("info", message);
          }
        });
      }

      // Initialize
      (async () => {
        if (!electronAPI || !electronAPI.ios) {
          appendLog("error", "iOS API tidak tersedia.");
          statusText.textContent = "Error";
          statusDetail.textContent = "iOS API tidak tersedia";
          return;
        }

        // Check if iOS simulators are available
        const checkResult = await electronAPI.ios.checkAvailability();
        if (!checkResult.available) {
          appendLog("error", "Xcode atau simctl tidak ditemukan.");
          statusText.textContent = "Xcode Tidak Ditemukan";
          statusDetail.textContent = "Install Xcode dari App Store";
          return;
        }

        appendLog("success", "iOS Simulator tersedia");
        await loadDevices();
      })();
    </script>
  </body>
</html>
