<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Android Remote Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f3460;
        color: #eee;
        overflow: hidden;
        height: 100vh;
        width: 220px;
      }

      #sidebar {
        width: 100%;
        background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
        border-left: 1px solid rgba(61, 220, 132, 0.2);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        gap: 8px;
        overflow-y: auto;
      }

      .sidebar-header {
        text-align: center;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 8px;
      }

      .sidebar-header h2 {
        font-size: 16px;
        color: #3ddc84;
        margin-bottom: 4px;
      }

      .sidebar-header .device-name {
        font-size: 11px;
        color: #999;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .control-btn {
        background: linear-gradient(135deg, #3ddc84 0%, #2ecc71 100%);
        color: #000;
        border: none;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(61, 220, 132, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .control-btn:hover {
        background: linear-gradient(135deg, #32c972 0%, #27ae60 100%);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(61, 220, 132, 0.4);
      }

      .control-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 6px rgba(61, 220, 132, 0.3);
      }

      .control-btn:disabled {
        background: #555;
        cursor: not-allowed;
        opacity: 0.5;
        box-shadow: none;
      }

      .control-btn.danger {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
      }

      .control-btn.danger:hover {
        background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
      }

      .control-btn.secondary {
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        box-shadow: 0 2px 8px rgba(52, 152, 219, 0.3);
      }

      .control-btn.secondary:hover {
        background: linear-gradient(135deg, #2980b9 0%, #1f6ca1 100%);
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
      }

      .btn-icon {
        font-size: 16px;
      }

      .section-label {
        font-size: 10px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 12px;
        margin-bottom: 4px;
        padding-left: 4px;
      }

      .recording-indicator {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        background: rgba(231, 76, 60, 0.2);
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .recording-indicator.active {
        display: flex;
      }

      .recording-dot {
        width: 8px;
        height: 8px;
        background: #e74c3c;
        border-radius: 50%;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .recording-text {
        font-size: 11px;
        color: #e74c3c;
        font-weight: 600;
      }

      .status-message {
        font-size: 11px;
        color: #3ddc84;
        text-align: center;
        padding: 8px;
        background: rgba(61, 220, 132, 0.1);
        border-radius: 6px;
        margin-top: auto;
        display: none;
      }

      .status-message.show {
        display: block;
      }

      /* Scrollbar styling */
      #sidebar::-webkit-scrollbar {
        width: 6px;
      }

      #sidebar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 3px;
      }

      #sidebar::-webkit-scrollbar-thumb {
        background: rgba(61, 220, 132, 0.3);
        border-radius: 3px;
      }

      #sidebar::-webkit-scrollbar-thumb:hover {
        background: rgba(61, 220, 132, 0.5);
      }
    </style>
  </head>
  <body>
      <div id="sidebar">
        <div class="sidebar-header">
          <h2>Remote Control</h2>
          <div class="device-name" id="deviceName">Android Device</div>
        </div>

        <div class="recording-indicator" id="recordingIndicator">
          <div class="recording-dot"></div>
          <span class="recording-text">Recording...</span>
        </div>

        <div class="section-label">Power</div>
        <button class="control-btn" id="btnWake" title="Wake screen">
          <span class="btn-icon">☀️</span>
          <span>Wake</span>
        </button>
        <button class="control-btn" id="btnUnlock" title="Unlock device">
          <span class="btn-icon">🔓</span>
          <span>Unlock</span>
        </button>

        <div class="section-label">Navigation</div>
        <button class="control-btn secondary" id="btnBack" title="Back button">
          <span class="btn-icon">◀</span>
          <span>Back</span>
        </button>
        <button class="control-btn secondary" id="btnHome" title="Home button">
          <span class="btn-icon">🏠</span>
          <span>Home</span>
        </button>
        <button class="control-btn secondary" id="btnRecent" title="Recent apps">
          <span class="btn-icon">📱</span>
          <span>Recent</span>
        </button>

        <div class="section-label">Screen</div>
        <button class="control-btn" id="btnRotate" title="Rotate screen">
          <span class="btn-icon">🔄</span>
          <span>Rotate</span>
        </button>
        <button class="control-btn" id="btnScreenshot" title="Take screenshot">
          <span class="btn-icon">📸</span>
          <span>Screenshot</span>
        </button>

        <div class="section-label">Recording</div>
        <button class="control-btn" id="btnRecord" title="Start recording">
          <span class="btn-icon">⏺</span>
          <span>Record</span>
        </button>
        <button class="control-btn danger" id="btnStopRecord" style="display:none;" title="Stop recording">
          <span class="btn-icon">⏹</span>
          <span>Stop Rec</span>
        </button>

        <div class="section-label">Volume</div>
        <button class="control-btn secondary" id="btnVolumeUp" title="Volume up">
          <span class="btn-icon">🔊</span>
          <span>Vol +</span>
        </button>
        <button class="control-btn secondary" id="btnVolumeDown" title="Volume down">
          <span class="btn-icon">🔉</span>
          <span>Vol -</span>
        </button>

        <div class="status-message" id="statusMessage"></div>
      </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const uid = params.get("uid") || "";
        const deviceName = params.get("deviceName") || "Android Device";
        const adbId = params.get("adbId") || "";

        // Update device name
        document.getElementById("deviceName").textContent = deviceName;

        const statusMessage = document.getElementById("statusMessage");
        const recordingIndicator = document.getElementById("recordingIndicator");
        const btnRecord = document.getElementById("btnRecord");
        const btnStopRecord = document.getElementById("btnStopRecord");

        let isRecording = false;

        function showStatus(message, duration = 2000) {
          statusMessage.textContent = message;
          statusMessage.classList.add("show");
          setTimeout(() => {
            statusMessage.classList.remove("show");
          }, duration);
        }

        async function executeCommand(command, params = {}) {
          if (!window.electronAPI || !window.electronAPI.androidRemote) {
            showStatus("Error: API not available");
            return;
          }

          try {
            const result = await window.electronAPI.androidRemote[command](uid, params);
            if (result && result.message) {
              showStatus(result.message);
            }
            return result;
          } catch (err) {
            showStatus(err.message || "Command failed");
            console.error("Command failed:", command, err);
          }
        }

        // Power controls
        document.getElementById("btnWake").addEventListener("click", () => {
          executeCommand("wake");
        });

        document.getElementById("btnUnlock").addEventListener("click", () => {
          executeCommand("unlock");
        });

        // Navigation controls
        document.getElementById("btnBack").addEventListener("click", () => {
          executeCommand("pressBack");
        });

        document.getElementById("btnHome").addEventListener("click", () => {
          executeCommand("pressHome");
        });

        document.getElementById("btnRecent").addEventListener("click", () => {
          executeCommand("pressRecent");
        });

        // Screen controls
        document.getElementById("btnRotate").addEventListener("click", () => {
          executeCommand("rotate");
        });

        document.getElementById("btnScreenshot").addEventListener("click", async () => {
          const result = await executeCommand("screenshot");
          if (result && result.path) {
            showStatus(`Screenshot saved: ${result.path}`, 3000);
          }
        });

        // Recording controls
        document.getElementById("btnRecord").addEventListener("click", () => {
          isRecording = true;
          btnRecord.style.display = "none";
          btnStopRecord.style.display = "flex";
          recordingIndicator.classList.add("active");
          executeCommand("startRecording");
        });

        document.getElementById("btnStopRecord").addEventListener("click", async () => {
          isRecording = false;
          btnRecord.style.display = "flex";
          btnStopRecord.style.display = "none";
          recordingIndicator.classList.remove("active");
          const result = await executeCommand("stopRecording");
          if (result && result.path) {
            const msg = result.manualSave
              ? `Recording saved: ${result.path}`
              : `Recording kept at ${result.path}`;
            showStatus(msg, 3000);
          }
        });

        // Volume controls
        document.getElementById("btnVolumeUp").addEventListener("click", () => {
          executeCommand("volumeUp");
        });

        document.getElementById("btnVolumeDown").addEventListener("click", () => {
          executeCommand("volumeDown");
        });

        // Log initialization
        console.log("Android Remote Control initialized", { uid, deviceName, adbId });
      })();
    </script>
  </body>
</html>
